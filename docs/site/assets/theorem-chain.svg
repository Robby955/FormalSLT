<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1470" viewBox="0 0 1400 1470" role="img" aria-labelledby="title desc">
  <title id="title">FormalSLT proof architecture</title>
  <desc id="desc">A source-faithful map of three connected FormalSLT research layers: offline reverse-IID and forward e-process empirical-Bernstein PAC-Bayes, adaptive full-prefix trajectory inference, and known- plus unknown-kernel stationary Poisson certification. Status labels distinguish directly proved components, proved compositions, conditional applications, and open nonclaims.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .subpanel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; }
      .proved { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .derived { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .conditional { fill: #fffbeb; stroke: #b45309; stroke-width: 2; }
      .open { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .edge { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .join { stroke: #475569; stroke-width: 2; fill: none; }
      .divider { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 6; }
      .title { fill: #0f172a; font-size: 30px; font-weight: 750; }
      .subtitle { fill: #334155; font-size: 16px; }
      .section { fill: #0f172a; font-size: 22px; font-weight: 750; }
      .lane { fill: #475569; font-size: 14px; font-weight: 750; letter-spacing: 0.08em; }
      .node-title { fill: #0f172a; font-size: 15px; font-weight: 700; }
      .node-line { fill: #334155; font-size: 13px; }
      .theorem { fill: #334155; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .theorem-small { fill: #334155; font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .status { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; }
      .status-proved { fill: #065f46; }
      .status-derived { fill: #1d4ed8; }
      .status-conditional { fill: #92400e; }
      .status-open { fill: #475569; }
      .note-text { fill: #334155; font-size: 13px; }
      .note-strong { fill: #0f172a; font-size: 13px; font-weight: 700; }
      .legend { fill: #334155; font-size: 13px; }
      .caption { fill: #475569; font-size: 13px; font-style: italic; }
    </style>
  </defs>

  <rect width="1400" height="1470" class="bg"/>
  <text x="700" y="45" text-anchor="middle" class="title">FormalSLT proof architecture</text>
  <text x="700" y="75" text-anchor="middle" class="subtitle">Five checked capstones, with application conditions and nonclaims kept visible</text>

  <rect x="70" y="98" width="22" height="22" rx="5" class="proved"/>
  <text x="102" y="114" class="legend"><tspan font-weight="700">PROVED</tspan> — checked theorem</text>
  <rect x="385" y="98" width="22" height="22" rx="5" class="derived"/>
  <text x="417" y="114" class="legend"><tspan font-weight="700">PROVED COMPOSITION</tspan> — checked capstone</text>
  <rect x="750" y="98" width="22" height="22" rx="5" class="conditional"/>
  <text x="782" y="114" class="legend"><tspan font-weight="700">CONDITIONAL</tspan> — displayed premise required</text>
  <rect x="1110" y="98" width="22" height="22" rx="5" class="open"/>
  <text x="1142" y="114" class="legend"><tspan font-weight="700">OPEN</tspan> — not established</text>
  <text x="700" y="145" text-anchor="middle" class="caption">Composition labels describe the theorem chain, not literature novelty; source-fidelity labels live in the literature ledger.</text>

  <rect x="30" y="165" width="1340" height="345" rx="16" class="panel"/>
  <text x="55" y="200" class="section">1. Anytime empirical-Bernstein PAC-Bayes</text>
  <text x="355" y="231" text-anchor="middle" class="lane">OFFLINE REVERSE-IID ROUTE</text>
  <text x="1045" y="231" text-anchor="middle" class="lane">FORWARD E-PROCESS ROUTE</text>
  <line x1="700" y1="218" x2="700" y2="475" class="divider"/>
  <text x="700" y="493" text-anchor="middle" class="caption">Parallel routes: the reverse theorem is not the forward engine.</text>

  <rect x="55" y="250" width="270" height="112" rx="11" class="proved"/>
  <text x="190" y="275" text-anchor="middle" class="status status-proved">PROVED</text>
  <text x="190" y="300" text-anchor="middle" class="node-title">Reverse Bessel martingale</text>
  <text x="190" y="322" text-anchor="middle" class="node-line">reverse maximal inequality</text>
  <text x="190" y="342" text-anchor="middle" class="node-line">+ dyadic epoch stitch</text>
  <path d="M325 306 L365 306" class="edge"/>
  <rect x="365" y="250" width="295" height="112" rx="11" class="proved"/>
  <text x="512" y="273" text-anchor="middle" class="status status-proved">PROVED</text>
  <text x="512" y="297" text-anchor="middle" class="node-title">All-sample-size IID endpoint</text>
  <text x="512" y="321" text-anchor="middle" class="theorem">exists_continuousInfiniteEmpirical</text>
  <text x="512" y="339" text-anchor="middle" class="theorem">Bernstein_event</text>
  <rect x="55" y="382" width="605" height="78" rx="9" class="note"/>
  <text x="72" y="405" class="note-strong">Scope:</text>
  <text x="120" y="405" class="note-text">finite-valued IID observations; arbitrary measurable hypotheses.</text>
  <text x="72" y="428" class="note-text">One posterior-independent event, every n ≥ 2. Offline guarantee only:</text>
  <text x="72" y="449" class="note-text">no e-process or optional-stopping semantics.</text>

  <rect x="735" y="250" width="185" height="112" rx="11" class="proved"/>
  <text x="827" y="273" text-anchor="middle" class="status status-proved">PROVED</text>
  <text x="827" y="298" text-anchor="middle" class="node-title">Predictable-residual</text>
  <text x="827" y="320" text-anchor="middle" class="node-title">e-process</text>
  <text x="827" y="342" text-anchor="middle" class="node-line">fixed conditional means</text>
  <path d="M920 306 L945 306" class="edge"/>
  <rect x="945" y="250" width="185" height="112" rx="11" class="proved"/>
  <text x="1037" y="273" text-anchor="middle" class="status status-proved">PROVED</text>
  <text x="1037" y="298" text-anchor="middle" class="node-title">Countable weighted</text>
  <text x="1037" y="320" text-anchor="middle" class="node-title">tilt master e-process</text>
  <text x="1037" y="342" text-anchor="middle" class="node-line">one common Ville event</text>
  <path d="M1130 306 L1155 306" class="edge"/>
  <rect x="1155" y="250" width="190" height="112" rx="11" class="derived"/>
  <text x="1250" y="273" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="1250" y="296" text-anchor="middle" class="node-title">Geometric all-time endpoint</text>
  <text x="1250" y="318" text-anchor="middle" class="theorem-small">exists_geometricForwardBessel</text>
  <text x="1250" y="335" text-anchor="middle" class="theorem-small">PACBayes_allTime_</text>
  <text x="1250" y="352" text-anchor="middle" class="theorem-small">vanishing_event</text>
  <rect x="735" y="382" width="610" height="78" rx="9" class="note"/>
  <text x="752" y="405" class="note-strong">Scope:</text>
  <text x="800" y="405" class="note-text">finite hypotheses, full-support prior, fixed conditional means.</text>
  <text x="752" y="428" class="note-text">Path/time-dependent posterior substitution is allowed. The selected</text>
  <text x="752" y="449" class="note-text">hybrid-Bessel boundary vanishes, but that envelope is not itself an e-process.</text>

  <rect x="30" y="530" width="1340" height="300" rx="16" class="panel"/>
  <text x="55" y="566" class="section">2. Adaptive full-prefix trajectory inference</text>
  <rect x="55" y="592" width="245" height="105" rx="11" class="proved"/>
  <text x="177" y="615" text-anchor="middle" class="status status-proved">PROVED</text>
  <text x="177" y="640" text-anchor="middle" class="node-title">Full-prefix trajectory law</text>
  <text x="177" y="662" text-anchor="middle" class="node-line">prefix-dependent kernels</text>
  <text x="177" y="682" text-anchor="middle" class="node-line">+ conditional-risk identity</text>
  <path d="M300 644 L330 644" class="edge"/>
  <rect x="330" y="592" width="245" height="105" rx="11" class="derived"/>
  <text x="452" y="615" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="452" y="640" text-anchor="middle" class="node-title">Predictable-mean adapter</text>
  <text x="452" y="662" text-anchor="middle" class="node-line">bounded declared scores</text>
  <text x="452" y="682" text-anchor="middle" class="node-line">observe prefix before next outcome</text>
  <path d="M575 644 L605 644" class="edge"/>
  <rect x="605" y="592" width="245" height="105" rx="11" class="derived"/>
  <text x="727" y="615" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="727" y="640" text-anchor="middle" class="node-title">Countable confidence allocation</text>
  <text x="727" y="662" text-anchor="middle" class="node-line">singleton tilt events</text>
  <text x="727" y="682" text-anchor="middle" class="node-line">not a countable master e-process</text>
  <path d="M850 644 L880 644" class="edge"/>
  <rect x="880" y="592" width="465" height="105" rx="11" class="derived"/>
  <text x="1112" y="615" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="1112" y="638" text-anchor="middle" class="node-title">Vanishing all-time trajectory endpoint</text>
  <text x="1112" y="661" text-anchor="middle" class="theorem">exists_trajectoryCountableEmpiricalBernsteinPACBayes_</text>
  <text x="1112" y="679" text-anchor="middle" class="theorem">allTime_vanishing_event</text>
  <rect x="55" y="718" width="1290" height="82" rx="9" class="note"/>
  <text x="72" y="742" class="note-strong">Conditions:</text>
  <text x="157" y="742" class="note-text">finite state and hypothesis types; deterministic start; bounded score family declared before the path.</text>
  <text x="72" y="765" class="note-text">A score may encode a fixed-in-advance online update rule using the observed prefix. The posterior may depend on path and time.</text>
  <text x="72" y="787" class="note-text">Not allowed: inventing a new score or catalog member after observing the outcomes it scores.</text>

  <rect x="30" y="850" width="1340" height="500" rx="16" class="panel"/>
  <text x="55" y="886" class="section">3. Stationary Poisson certification</text>
  <rect x="48" y="908" width="1304" height="170" rx="12" class="subpanel"/>
  <text x="65" y="932" class="lane">KNOWN FINITE KERNEL</text>
  <rect x="65" y="947" width="235" height="88" rx="10" class="conditional"/>
  <text x="182" y="969" text-anchor="middle" class="status status-conditional">CONDITIONAL</text>
  <text x="182" y="989" text-anchor="middle" class="node-title">Known finite P + supplied</text>
  <text x="182" y="1007" text-anchor="middle" class="node-title">invariant PMF</text>
  <text x="182" y="1026" text-anchor="middle" class="node-line">strict 0 ≤ α &lt; 1 contraction</text>
  <path d="M300 991 L330 991" class="edge"/>
  <rect x="330" y="947" width="245" height="88" rx="10" class="proved"/>
  <text x="452" y="969" text-anchor="middle" class="status status-proved">PROVED</text>
  <text x="452" y="993" text-anchor="middle" class="node-title">Finite-depth Poisson potential</text>
  <text x="452" y="1015" text-anchor="middle" class="node-line">span + residual bounds</text>
  <path d="M575 991 L605 991" class="edge"/>
  <rect x="605" y="947" width="245" height="88" rx="10" class="derived"/>
  <text x="727" y="969" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="727" y="993" text-anchor="middle" class="node-title">Depth + tilt allocation</text>
  <text x="727" y="1015" text-anchor="middle" class="node-line">logarithmic depth selector</text>
  <path d="M850 991 L880 991" class="edge"/>
  <rect x="880" y="947" width="455" height="88" rx="10" class="conditional"/>
  <text x="1107" y="969" text-anchor="middle" class="status status-conditional">PROVED / CONDITIONAL APPLICATION</text>
  <text x="1107" y="992" text-anchor="middle" class="node-title">Known-kernel vanishing stationary endpoint</text>
  <text x="1107" y="1014" text-anchor="middle" class="theorem">exists_stationaryPoissonDepthSelection_allTime_vanishing_event</text>
  <text x="65" y="1059" class="note-text">Finite score family and deterministic start; selected depth/tilt boundary is a confidence allocation, not an e-process.</text>

  <rect x="48" y="1092" width="1304" height="238" rx="12" class="subpanel"/>
  <text x="65" y="1117" class="lane">UNKNOWN FINITE HOMOGENEOUS KERNEL</text>
  <rect x="65" y="1132" width="235" height="92" rx="10" class="derived"/>
  <text x="182" y="1154" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="182" y="1178" text-anchor="middle" class="node-title">Transition-coordinate event</text>
  <text x="182" y="1200" text-anchor="middle" class="node-line">empirical TV confidence</text>
  <rect x="330" y="1132" width="245" height="92" rx="10" class="proved"/>
  <text x="452" y="1154" text-anchor="middle" class="status status-proved">PROVED</text>
  <text x="452" y="1178" text-anchor="middle" class="node-title">Finite invariant-law existence</text>
  <text x="452" y="1200" text-anchor="middle" class="theorem">finiteInvariantPMF P</text>
  <rect x="605" y="1132" width="245" height="92" rx="10" class="derived"/>
  <text x="727" y="1154" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="727" y="1178" text-anchor="middle" class="node-title">Predeclared candidate catalog</text>
  <text x="727" y="1200" text-anchor="middle" class="node-line">kernel + reference + score</text>
  <path d="M182 1224 L182 1234 L1107 1234" class="join"/>
  <path d="M452 1224 L452 1234" class="join"/>
  <path d="M727 1224 L727 1234" class="join"/>
  <path d="M1107 1234 L1107 1224" class="edge"/>
  <rect x="880" y="1132" width="455" height="92" rx="10" class="derived"/>
  <text x="1107" y="1154" text-anchor="middle" class="status status-derived">PROVED COMPOSITION</text>
  <text x="1107" y="1177" text-anchor="middle" class="node-title">Selected canonical stationary-catalog endpoint</text>
  <text x="1107" y="1200" text-anchor="middle" class="theorem">exists_selectedCanonicalEmpiricalStationaryCatalog_event</text>
  <rect x="65" y="1242" width="1270" height="68" rx="9" class="note"/>
  <text x="82" y="1265" class="note-strong">Conditions:</text>
  <text x="165" y="1265" class="note-text">every source row visited; finite predeclared catalog; mass cost δRisk + δTransition on the same path.</text>
  <text x="82" y="1288" class="note-text">No split or independence premise. Invariant-law uniqueness is obtained only if Dobrushin(Qc) + 2η &lt; 1.</text>

  <rect x="30" y="1370" width="1340" height="67" rx="12" class="open"/>
  <text x="50" y="1394" class="status status-open">OPEN / NOT CLAIMED</text>
  <text x="205" y="1394" class="note-text">all-real or data-chosen tilt optimization; data-created score/catalog members; computable invariant-law solver;</text>
  <text x="50" y="1418" class="note-text">irreducibility or mixing-rate theorem; e-process semantics for the selected trajectory, depth, or stationary-catalog allocation boundaries.</text>
  <text x="700" y="1458" text-anchor="middle" class="caption">Conceptual theorem-chain map, not an import graph. Exact assumptions live in theorem signatures and checker files.</text>
</svg>
