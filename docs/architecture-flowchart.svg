<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" role="img" aria-labelledby="title desc">
  <title id="title">FormalSLT intended import direction</title>
  <desc id="desc">Layered diagram of the intended dependency direction for FormalSLT modules. Foundations (Probability, LinearAlgebra, core definitions) feed the concentration layer (Concentration, Azuma), which feeds the subject theorem families (Rademacher, VC, Covering, Stability, PACBayes, AnytimeValid), which feed dependent data and interfaces (StochasticDynamics, OnlineToPAC, Statistics), which feed TestTimeMeta application compositions. This is a rule for new and refactored code, not a claim that every legacy import already follows it.</desc>
  <defs>
    <marker id="arrow-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; }
      .band-label { fill: #334155; font-size: 16px; font-weight: 700; letter-spacing: 0.05em; }
      .node-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; }
      .node-teal { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.8; }
      .node-purple { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 1.8; }
      .node-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 1.8; }
      .title-text { fill: #0f172a; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #334155; font-size: 17px; }
      .node-title { fill: #0f172a; font-size: 17px; font-weight: 700; }
      .node-line { fill: #1e293b; font-size: 16px; }
      .footer { fill: #334155; font-size: 16px; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow-slate); }
    </style>
  </defs>

  <rect width="1240" height="880" class="bg"/>

  <text x="620" y="44" text-anchor="middle" class="title-text">FormalSLT intended import direction</text>
  <text x="620" y="72" text-anchor="middle" class="subtitle">Where new and refactored modules belong, following ARCHITECTURE.md</text>

  <!-- Band 1: foundations -->
  <rect x="40" y="96" width="1160" height="118" rx="12" class="band"/>
  <text x="58" y="122" class="band-label">FOUNDATIONS</text>
  <rect x="90" y="134" width="330" height="64" rx="10" class="node-blue"/>
  <text x="255" y="160" text-anchor="middle" class="node-title">Probability</text>
  <text x="255" y="182" text-anchor="middle" class="node-line">expectations, product measures</text>
  <rect x="452" y="134" width="330" height="64" rx="10" class="node-blue"/>
  <text x="617" y="160" text-anchor="middle" class="node-title">LinearAlgebra</text>
  <text x="617" y="182" text-anchor="middle" class="node-line">deterministic inequalities</text>
  <rect x="814" y="134" width="330" height="64" rx="10" class="node-blue"/>
  <text x="979" y="160" text-anchor="middle" class="node-title">Core definitions</text>
  <text x="979" y="182" text-anchor="middle" class="node-line">Risk, ERM, UniformConvergence</text>

  <path d="M620 214 L620 244" class="edge"/>

  <!-- Band 2: concentration -->
  <rect x="40" y="248" width="1160" height="118" rx="12" class="band"/>
  <text x="58" y="274" class="band-label">CONCENTRATION LAYER</text>
  <rect x="271" y="286" width="330" height="64" rx="10" class="node-teal"/>
  <text x="436" y="312" text-anchor="middle" class="node-title">Concentration</text>
  <text x="436" y="334" text-anchor="middle" class="node-line">sharp McDiarmid, sub-Gamma</text>
  <rect x="633" y="286" width="330" height="64" rx="10" class="node-teal"/>
  <text x="798" y="312" text-anchor="middle" class="node-title">Azuma</text>
  <text x="798" y="334" text-anchor="middle" class="node-line">exposure martingales, genGap tails</text>

  <path d="M620 366 L620 396" class="edge"/>

  <!-- Band 3: subject families -->
  <rect x="40" y="400" width="1160" height="118" rx="12" class="band"/>
  <text x="58" y="426" class="band-label">SUBJECT THEOREM FAMILIES</text>
  <rect x="64" y="438" width="176" height="64" rx="10" class="node-teal"/>
  <text x="152" y="475" text-anchor="middle" class="node-title">Rademacher</text>
  <rect x="252" y="438" width="176" height="64" rx="10" class="node-teal"/>
  <text x="340" y="475" text-anchor="middle" class="node-title">VC</text>
  <rect x="440" y="438" width="176" height="64" rx="10" class="node-teal"/>
  <text x="528" y="475" text-anchor="middle" class="node-title">Covering</text>
  <rect x="628" y="438" width="176" height="64" rx="10" class="node-teal"/>
  <text x="716" y="475" text-anchor="middle" class="node-title">Stability</text>
  <rect x="816" y="438" width="176" height="64" rx="10" class="node-teal"/>
  <text x="904" y="475" text-anchor="middle" class="node-title">PACBayes</text>
  <rect x="1004" y="438" width="176" height="64" rx="10" class="node-purple"/>
  <text x="1092" y="475" text-anchor="middle" class="node-title">AnytimeValid</text>

  <path d="M620 518 L620 548" class="edge"/>

  <!-- Band 4: dependent data and interfaces -->
  <rect x="40" y="552" width="1160" height="118" rx="12" class="band"/>
  <text x="58" y="578" class="band-label">DEPENDENT DATA + INTERFACES</text>
  <rect x="90" y="590" width="330" height="64" rx="10" class="node-teal"/>
  <text x="255" y="616" text-anchor="middle" class="node-title">StochasticDynamics</text>
  <text x="255" y="638" text-anchor="middle" class="node-line">Markov path laws, prequential risk</text>
  <rect x="452" y="590" width="330" height="64" rx="10" class="node-teal"/>
  <text x="617" y="616" text-anchor="middle" class="node-title">OnlineToPAC</text>
  <text x="617" y="638" text-anchor="middle" class="node-line">regret to statistical risk</text>
  <rect x="814" y="590" width="330" height="64" rx="10" class="node-teal"/>
  <text x="979" y="616" text-anchor="middle" class="node-title">Statistics</text>
  <text x="979" y="638" text-anchor="middle" class="node-line">estimation and model interfaces</text>

  <path d="M620 670 L620 700" class="edge"/>

  <!-- Band 5: compositions -->
  <rect x="40" y="704" width="1160" height="96" rx="12" class="band"/>
  <text x="58" y="730" class="band-label">APPLICATION COMPOSITIONS</text>
  <rect x="452" y="722" width="330" height="64" rx="10" class="node-amber"/>
  <text x="617" y="748" text-anchor="middle" class="node-title">TestTimeMeta</text>
  <text x="617" y="770" text-anchor="middle" class="node-line">compositions of established bounds</text>

  <text x="40" y="836" class="footer">Intended direction for new and refactored code, not a claim that every legacy import already follows it.</text>
  <text x="40" y="862" class="footer">Mathematically necessary cross-subject imports stay narrow and are documented in module docstrings.</text>
</svg>
