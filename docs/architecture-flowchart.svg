  <text x="30" y="910" class="cluster-title">Reading the diagram</text>
  <text x="30" y="930" class="footer">Boxes labelled in dark fill are the headline theorems whose axiom transcript appears in the README.</text>
  <text x="30" y="948" class="footer">Concentration backbone (indigo) feeds genGap tails into Symmetrization+Capacity (cyan/amber) and PAC-Bayes (violet).</text>
  <text x="30" y="966" class="footer">Edges show import-or-use dependency on the corresponding Mathlib API or FormalSLT lemma.</text>
  <text x="30" y="984" class="footer">Finite/discrete throughout: continuous Dudley integral and continuous-posterior PAC-Bayes remain open targets.</text>

  <text x="30" y="1042" class="footer">Edge palette: solid arrows = direct theorem dependency. Dark headline boxes = entries in the README axiom transcript.</text>
  <text x="30" y="1060" class="footer">Cluster palette: slate = core, indigo = concentration, cyan = symmetrization/chaining, amber = VC capacity, violet = PAC-Bayes.</text>
  <text x="30" y="1078" class="footer">Source-of-truth: theorem-map.md and proof-frontier.md inside /docs.</text>
</svg>
