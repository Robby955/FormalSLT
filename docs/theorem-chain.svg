<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
  <title id="title">FormalSLT theorem chain</title>
  <desc id="desc">A dependency diagram for the finite statistical learning theory spine in Lean.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.5; rx: 14; }
      .node { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .node-green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; rx: 10; }
      .node-gold { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; rx: 10; }
      .node-gray { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; rx: 10; stroke-dasharray: 5 4; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 760; }
      .subtitle { fill: #475569; font-size: 13px; }
      .section { fill: #1e293b; font-size: 14px; font-weight: 720; letter-spacing: 0.02em; }
      .label { fill: #0f172a; font-size: 13px; font-weight: 690; }
      .small { fill: #475569; font-size: 11px; }
      .tiny { fill: #64748b; font-size: 10px; }
      .arrow-blue { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1100" height="900" class="bg"/>

  <text x="550" y="40" text-anchor="middle" class="title">FormalSLT theorem chain</text>
  <text x="550" y="62" text-anchor="middle" class="subtitle">
    45 Lean modules · zero sorry · zero admit · axioms: propext, Classical.choice, Quot.sound
  </text>

  <rect x="38" y="92" width="675" height="630" class="panel"/>
  <text x="70" y="126" class="section">Core finite Rademacher and VC spine</text>

  <rect x="86" y="152" width="230" height="58" class="node"/>
  <text x="201" y="177" text-anchor="middle" class="label">Risk / ERM / GenGap</text>
  <text x="201" y="194" text-anchor="middle" class="small">finite samples and product measures</text>

  <rect x="430" y="152" width="230" height="58" class="node"/>
  <text x="545" y="177" text-anchor="middle" class="label">Empirical Rademacher</text>
  <text x="545" y="194" text-anchor="middle" class="small">Rad(H,S) over finite classes</text>

  <path d="M316 181 C355 181, 391 181, 430 181" class="arrow-blue"/>

  <rect x="258" y="246" width="230" height="58" class="node"/>
  <text x="373" y="271" text-anchor="middle" class="label">Symmetrization</text>
  <text x="373" y="288" text-anchor="middle" class="small">E[genGap] ≤ 2 E[Rad]</text>

  <path d="M545 210 C545 232, 490 246, 488 270" class="arrow-blue"/>
  <path d="M201 210 C201 232, 256 246, 258 270" class="arrow-blue"/>

  <rect x="86" y="340" width="230" height="58" class="node"/>
  <text x="201" y="365" text-anchor="middle" class="label">Azuma tail</text>
  <text x="201" y="382" text-anchor="middle" class="small">exp(-ε²n / 8B²)</text>

  <rect x="430" y="340" width="230" height="58" class="node"/>
  <text x="545" y="365" text-anchor="middle" class="label">Massart finite-class</text>
  <text x="545" y="382" text-anchor="middle" class="small">B sqrt(2 log card(H) / n)</text>

  <path d="M317 302 C260 314, 226 323, 201 340" class="arrow-blue"/>
  <path d="M429 302 C485 314, 520 323, 545 340" class="arrow-blue"/>

  <rect x="258" y="434" width="230" height="58" class="node"/>
  <text x="373" y="459" text-anchor="middle" class="label">High-probability Rademacher</text>
  <text x="373" y="476" text-anchor="middle" class="small">expectation + concentration</text>

  <path d="M201 398 C224 422, 254 438, 258 460" class="arrow-blue"/>
  <path d="M545 398 C522 422, 492 438, 488 460" class="arrow-blue"/>

  <rect x="86" y="528" width="230" height="58" class="node-gold"/>
  <text x="201" y="553" text-anchor="middle" class="label">Sauer-Shelah</text>
  <text x="201" y="570" text-anchor="middle" class="small">Σ C(n,k) ≤ (en/d)^d</text>

  <rect x="430" y="528" width="230" height="58" class="node-gold"/>
  <text x="545" y="553" text-anchor="middle" class="label">Binary VC bridge</text>
  <text x="545" y="570" text-anchor="middle" class="small">0-1 traces = loss patterns</text>

  <rect x="258" y="622" width="230" height="58" class="node-gold"/>
  <text x="373" y="647" text-anchor="middle" class="label">VC ERM excess-risk tail</text>
  <text x="373" y="664" text-anchor="middle" class="small">finite VC-style sample complexity</text>

  <path d="M373 492 C373 530, 373 584, 373 622" class="arrow-blue"/>
  <path d="M201 586 C232 608, 253 622, 258 648" class="arrow-blue"/>
  <path d="M545 586 C514 608, 493 622, 488 648" class="arrow-blue"/>

  <rect x="745" y="92" width="317" height="750" class="panel"/>
  <text x="775" y="126" class="section">Verified extensions</text>

  <rect x="785" y="152" width="237" height="60" class="node-green"/>
  <text x="904" y="177" text-anchor="middle" class="label">Finite scalar contraction</text>
  <text x="904" y="194" text-anchor="middle" class="small">Rad(φ ∘ F) ≤ L Rad(F)</text>

  <rect x="785" y="246" width="237" height="60" class="node-green"/>
  <text x="904" y="271" text-anchor="middle" class="label">Linear predictors</text>
  <text x="904" y="288" text-anchor="middle" class="small">Rad ≤ R/n sqrt(Σ ||xᵢ||²)</text>

  <rect x="785" y="340" width="237" height="60" class="node-green"/>
  <text x="904" y="365" text-anchor="middle" class="label">Finite covering</text>
  <text x="904" y="382" text-anchor="middle" class="small">ε-net peeling and two-scale chaining</text>

  <rect x="785" y="434" width="237" height="60" class="node-green"/>
  <text x="904" y="459" text-anchor="middle" class="label">Finite sub-Gaussian max</text>
  <text x="904" y="476" text-anchor="middle" class="small">MGF control ⇒ E sup bound</text>

  <rect x="785" y="528" width="237" height="60" class="node-green"/>
  <text x="904" y="553" text-anchor="middle" class="label">Finite chaining</text>
  <text x="904" y="570" text-anchor="middle" class="small">projection-pair entropy sums</text>

  <rect x="785" y="622" width="237" height="60" class="node-green"/>
  <text x="904" y="647" text-anchor="middle" class="label">Finite Dudley budgets</text>
  <text x="904" y="664" text-anchor="middle" class="small">dyadic finite entropy wrappers</text>

  <rect x="785" y="716" width="237" height="60" class="node-green"/>
  <text x="904" y="741" text-anchor="middle" class="label">PAC-Bayes finite Catoni</text>
  <text x="904" y="758" text-anchor="middle" class="small">bounded-loss confidence bound</text>

  <path d="M660 181 C700 181, 742 181, 785 181" class="arrow-green"/>
  <path d="M660 181 C708 205, 742 246, 785 270" class="arrow-green"/>
  <path d="M660 369 C704 369, 742 369, 785 369" class="arrow-green"/>
  <path d="M904 400 C904 412, 904 421, 904 434" class="arrow-green"/>
  <path d="M904 494 C904 506, 904 515, 904 528" class="arrow-green"/>
  <path d="M904 588 C904 600, 904 609, 904 622" class="arrow-green"/>

  <rect x="775" y="802" width="258" height="1" fill="#dbe3ef"/>
  <text x="775" y="822" class="tiny">Finite chaining is a finite entropy-budget layer.</text>
  <text x="775" y="838" class="tiny">Continuous Dudley is a separate theorem target.</text>
</svg>
