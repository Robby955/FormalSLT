<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 940" role="img" aria-labelledby="title desc">
  <title id="title">FormalSLT theorem chain</title>
  <desc id="desc">A dependency diagram for the finite statistical learning theory spine in Lean.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#047857"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; }
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .node { fill: #eef6ff; stroke: #1d4ed8; stroke-width: 1.6; rx: 10; }
      .node-green { fill: #ecfdf5; stroke: #047857; stroke-width: 1.6; rx: 10; }
      .node-gold { fill: #fffbeb; stroke: #b45309; stroke-width: 1.6; rx: 10; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #334155; font-size: 14px; }
      .section { fill: #0f172a; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
      .label { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .small { fill: #1e293b; font-size: 12px; }
      .tiny { fill: #334155; font-size: 12px; }
      .arrow-blue { stroke: #1d4ed8; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #047857; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1100" height="940" class="bg"/>

  <text x="550" y="42" text-anchor="middle" class="title">FormalSLT theorem chain</text>
  <text x="550" y="68" text-anchor="middle" class="subtitle">88 Lean modules, axioms: propext, Classical.choice, Quot.sound, zero sorry, zero admit</text>

  <rect x="38" y="96" width="675" height="630" class="panel"/>
  <text x="70" y="128" class="section">Core finite Rademacher and VC spine</text>

  <rect x="86" y="156" width="230" height="60" class="node"/>
  <text x="201" y="181" text-anchor="middle" class="label">Risk / ERM / GenGap</text>
  <text x="201" y="200" text-anchor="middle" class="small">finite samples and product measures</text>

  <rect x="430" y="156" width="230" height="60" class="node"/>
  <text x="545" y="181" text-anchor="middle" class="label">Empirical Rademacher</text>
  <text x="545" y="200" text-anchor="middle" class="small">Rad(H, S) over finite classes</text>

  <path d="M316 186 L430 186" class="arrow-blue"/>

  <rect x="258" y="250" width="230" height="60" class="node"/>
  <text x="373" y="275" text-anchor="middle" class="label">Symmetrization</text>
  <text x="373" y="294" text-anchor="middle" class="small">E[genGap] &lt;= 2 E[Rad]</text>

  <path d="M545 216 C545 234, 488 248, 488 250" class="arrow-blue"/>
  <path d="M201 216 C201 234, 258 248, 258 250" class="arrow-blue"/>

  <rect x="86" y="344" width="230" height="60" class="node"/>
  <text x="201" y="369" text-anchor="middle" class="label">Sharp McDiarmid genGap tail</text>
  <text x="201" y="388" text-anchor="middle" class="small">2 exp(-2 eps^2 / sum c_k^2)</text>

  <rect x="430" y="344" width="230" height="60" class="node"/>
  <text x="545" y="369" text-anchor="middle" class="label">Massart finite-class</text>
  <text x="545" y="388" text-anchor="middle" class="small">B sqrt(2 log card(H) / n)</text>

  <path d="M317 310 C260 322, 226 332, 201 344" class="arrow-blue"/>
  <path d="M429 310 C485 322, 520 332, 545 344" class="arrow-blue"/>

  <rect x="258" y="438" width="230" height="60" class="node"/>
  <text x="373" y="463" text-anchor="middle" class="label">High-probability Rademacher</text>
  <text x="373" y="482" text-anchor="middle" class="small">expectation + concentration</text>

  <path d="M201 404 C224 428, 254 442, 258 464" class="arrow-blue"/>
  <path d="M545 404 C522 428, 492 442, 488 464" class="arrow-blue"/>

  <rect x="86" y="532" width="230" height="60" class="node-gold"/>
  <text x="201" y="557" text-anchor="middle" class="label">Sauer-Shelah</text>
  <text x="201" y="576" text-anchor="middle" class="small">Sum C(n,k) &lt;= (e n / d)^d</text>

  <rect x="430" y="532" width="230" height="60" class="node-gold"/>
  <text x="545" y="557" text-anchor="middle" class="label">Binary VC bridge</text>
  <text x="545" y="576" text-anchor="middle" class="small">0-1 traces map to loss patterns</text>

  <rect x="258" y="626" width="230" height="60" class="node-gold"/>
  <text x="373" y="651" text-anchor="middle" class="label">VC ERM excess-risk tail</text>
  <text x="373" y="670" text-anchor="middle" class="small">finite VC-style sample complexity</text>

  <path d="M373 498 L373 626" class="arrow-blue"/>
  <path d="M201 592 C232 612, 253 624, 258 650" class="arrow-blue"/>
  <path d="M545 592 C514 612, 493 624, 488 650" class="arrow-blue"/>

  <rect x="745" y="96" width="317" height="750" class="panel"/>
  <text x="775" y="128" class="section">Verified extensions</text>

  <rect x="785" y="156" width="237" height="60" class="node-green"/>
  <text x="904" y="181" text-anchor="middle" class="label">Finite scalar contraction</text>
  <text x="904" y="200" text-anchor="middle" class="small">Rad(phi o F) &lt;= L Rad(F)</text>

  <rect x="785" y="250" width="237" height="60" class="node-green"/>
  <text x="904" y="275" text-anchor="middle" class="label">Linear predictors</text>
  <text x="904" y="294" text-anchor="middle" class="small">Rad &lt;= R/n sqrt(sum ||x_i||^2)</text>

  <rect x="785" y="344" width="237" height="60" class="node-green"/>
  <text x="904" y="369" text-anchor="middle" class="label">Finite covering</text>
  <text x="904" y="388" text-anchor="middle" class="small">eps-net peeling, two-scale chaining</text>

  <rect x="785" y="438" width="237" height="60" class="node-green"/>
  <text x="904" y="463" text-anchor="middle" class="label">Finite sub-Gaussian max</text>
  <text x="904" y="482" text-anchor="middle" class="small">MGF control implies E sup bound</text>

  <rect x="785" y="532" width="237" height="60" class="node-green"/>
  <text x="904" y="557" text-anchor="middle" class="label">Finite chaining</text>
  <text x="904" y="576" text-anchor="middle" class="small">projection-pair entropy sums</text>

  <rect x="785" y="626" width="237" height="60" class="node-green"/>
  <text x="904" y="651" text-anchor="middle" class="label">Finite Dudley budgets</text>
  <text x="904" y="670" text-anchor="middle" class="small">dyadic finite entropy wrappers</text>

  <rect x="785" y="720" width="237" height="60" class="node-green"/>
  <text x="904" y="745" text-anchor="middle" class="label">PAC-Bayes finite confidence</text>
  <text x="904" y="764" text-anchor="middle" class="small">Catoni, McAllester, Bernstein</text>

  <path d="M660 186 L785 186" class="arrow-green"/>
  <path d="M660 186 C715 210, 745 250, 785 274" class="arrow-green"/>
  <path d="M660 374 L785 374" class="arrow-green"/>
  <path d="M904 404 L904 438" class="arrow-green"/>
  <path d="M904 498 L904 532" class="arrow-green"/>
  <path d="M904 592 L904 626" class="arrow-green"/>
  <path d="M904 686 L904 720" class="arrow-green"/>

  <text x="775" y="812" class="tiny">Finite chaining is a finite entropy-budget layer.</text>
  <text x="775" y="830" class="tiny">Continuous Dudley is a separate theorem target.</text>

  <rect x="38" y="746" width="675" height="170" class="panel"/>
  <text x="70" y="776" class="section">Sharp McDiarmid bounded-differences (homogeneous product measure)</text>

  <rect x="58" y="796" width="200" height="72" class="node-green"/>
  <text x="158" y="820" text-anchor="middle" class="label">One-sided sharp tail</text>
  <text x="158" y="840" text-anchor="middle" class="small">exp(-2 eps^2 / sum c_k^2)</text>
  <text x="158" y="858" text-anchor="middle" class="tiny">bounded differences, product mu</text>

  <rect x="278" y="796" width="200" height="72" class="node-green"/>
  <text x="378" y="820" text-anchor="middle" class="label">Lower-tail wrapper</text>
  <text x="378" y="840" text-anchor="middle" class="small">apply to -f, same widths</text>
  <text x="378" y="858" text-anchor="middle" class="tiny">exp(-2 eps^2 / sum c_k^2)</text>

  <rect x="498" y="796" width="196" height="72" class="node-green"/>
  <text x="596" y="820" text-anchor="middle" class="label">Two-sided wrapper</text>
  <text x="596" y="840" text-anchor="middle" class="small">2 exp(-2 eps^2 / sum c_k^2)</text>
  <text x="596" y="858" text-anchor="middle" class="tiny">union of upper and lower</text>

  <path d="M258 832 L278 832" class="arrow-green"/>
  <path d="M478 832 L498 832" class="arrow-green"/>
  <text x="58" y="900" class="tiny">PAC-Bayes includes a finite Bernstein margin-proxy shell with a supplied variance proxy.</text>
</svg>
