<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc">
  <title id="title">FormalSLT scope frontier</title>
  <desc id="desc">Two-column diagram. The left column lists machine-checked surfaces: the finite-class learning spine, heterogeneous sharp McDiarmid, the VC route, metric entropy with checked entropy-integral endpoints, fixed-sample and all-sample-size empirical-Bernstein PAC-Bayes routes with exact Bessel variance, arbitrary measurable hypotheses and state spaces under supplied score contracts, anytime-valid inference with time-uniform PAC-Bayes endpoints, finite Markov specializations, and stability plus statistics plus composition surfaces. The right column lists open targets: arbitrary measurable-supremum Dudley constructions, a countable process-level tilt mixture, all-real tilt optimization, a forward exact-Bessel e-process and optional-stopping API, same-trajectory or predictable Markov learners, random initial laws and atomless transition receipts and mixing risk, an algorithm-specific online regret theorem, and a neural-network generalization theorem.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .bg { fill: #f8fafc; }
      .title-text { fill: #0f172a; font-size: 28px; font-weight: 700; }
      .subtitle { fill: #334155; font-size: 17px; }
      .col-in { fill: #ecfdf5; stroke: #0f766e; stroke-width: 1.6; }
      .col-out { fill: #f8fafc; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 6 5; }
      .col-title-in { fill: #134e4a; font-size: 18px; font-weight: 700; }
      .col-title-out { fill: #334155; font-size: 18px; font-weight: 700; }
      .item-in { fill: #ffffff; stroke: #0f766e; stroke-width: 1.4; }
      .item-out { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 4 4; }
      .item-label { fill: #0f172a; font-size: 17px; font-weight: 700; }
      .item-sub { fill: #1e293b; font-size: 16px; }
      .badge-in { fill: #0f766e; }
      .footer { fill: #334155; font-size: 16px; }
    </style>
  </defs>

  <rect width="1240" height="900" class="bg"/>

  <text x="620" y="44" text-anchor="middle" class="title-text">FormalSLT scope frontier</text>
  <text x="620" y="72" text-anchor="middle" class="subtitle">Machine-checked surfaces versus open formalization targets</text>

  <rect x="40" y="96" width="565" height="716" rx="12" class="col-in"/>
  <text x="60" y="128" class="col-title-in">Checked (axiom-clean Lean theorems)</text>

  <rect x="60" y="146" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="179" r="11" class="badge-in"/>
  <path d="M78 179 L83 184 L91 175" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="174" class="item-label">Finite-class learning spine</text>
  <text x="104" y="196" class="item-sub">symmetrization, Massart, high-probability wrappers</text>

  <rect x="60" y="228" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="261" r="11" class="badge-in"/>
  <path d="M78 261 L83 266 L91 257" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="256" class="item-label">Sharp McDiarmid, two-sided, heterogeneous laws</text>
  <text x="104" y="278" class="item-sub">2 exp(&#8722;2 &#949;&#178; / &#931; c&#8342;&#178;) over independent product coordinates</text>

  <rect x="60" y="310" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="343" r="11" class="badge-in"/>
  <path d="M78 343 L83 348 L91 339" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="338" class="item-label">VC and Sauer-Shelah binary route</text>
  <text x="104" y="360" class="item-sub">growth bounds, binary trace bridge, ERM sample complexity</text>

  <rect x="60" y="392" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="425" r="11" class="badge-in"/>
  <path d="M78 425 L83 430 L91 421" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="420" class="item-label">Metric entropy and Dudley boundary adapters</text>
  <text x="104" y="442" class="item-sub">checked entropy-integral endpoints under stated hypotheses</text>

  <rect x="60" y="474" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="507" r="11" class="badge-in"/>
  <path d="M78 507 L83 512 L91 503" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="502" class="item-label">Empirical-Bernstein PAC-Bayes</text>
  <text x="104" y="524" class="item-sub">all sample sizes + measurable hypotheses, exact Bessel variance</text>

  <rect x="60" y="556" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="589" r="11" class="badge-in"/>
  <path d="M78 589 L83 594 L91 585" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="584" class="item-label">Anytime-valid inference</text>
  <text x="104" y="606" class="item-sub">Ville, e-processes, betting; time-uniform PAC-Bayes endpoints</text>

  <rect x="60" y="638" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="671" r="11" class="badge-in"/>
  <path d="M78 671 L83 676 L91 667" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="666" class="item-label">Trajectory and Markov prequential risk</text>
  <text x="104" y="688" class="item-sub">arbitrary-state joint-score semantics + finite Markov specialization</text>

  <rect x="60" y="720" width="525" height="66" rx="8" class="item-in"/>
  <circle cx="84" cy="753" r="11" class="badge-in"/>
  <path d="M78 753 L83 758 L91 749" stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="748" class="item-label">Stability, statistics, compositions</text>
  <text x="104" y="770" class="item-sub">algorithmic stability, statistics interfaces, TestTimeMeta</text>

  <rect x="635" y="96" width="565" height="716" rx="12" class="col-out"/>
  <text x="655" y="128" class="col-title-out">Open targets (not yet proved)</text>

  <rect x="655" y="146" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="179" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="174" class="item-label">Arbitrary measurable-supremum Dudley theory</text>
  <text x="699" y="196" class="item-sub">non-finite-outcome constructions beyond boundary adapters</text>

  <rect x="655" y="228" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="261" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="256" class="item-label">Countable process-level tilt mixture</text>
  <text x="699" y="278" class="item-sub">summability and interchange beyond the finite process master</text>

  <rect x="655" y="310" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="343" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="338" class="item-label">All-real tilt optimization</text>
  <text x="699" y="360" class="item-sub">post-hoc selection over every real tilt, not a finite catalog</text>

  <rect x="655" y="392" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="425" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="420" class="item-label">Forward exact-Bessel e-process</text>
  <text x="699" y="442" class="item-sub">natural-filtration process and optional-stopping semantics</text>

  <rect x="655" y="474" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="507" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="502" class="item-label">Same-trajectory or predictable Markov learners</text>
  <text x="699" y="524" class="item-sub">catalogs trained on the path they are evaluated on</text>

  <rect x="655" y="556" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="589" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="584" class="item-label">Random initial laws, atomless receipts, mixing risk</text>
  <text x="699" y="606" class="item-sub">beyond deterministic starts and the checked two-atom Real receipt</text>

  <rect x="655" y="638" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="671" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="666" class="item-label">Algorithm-specific online regret theorem</text>
  <text x="699" y="688" class="item-sub">regret rates proved for a named online algorithm</text>

  <rect x="655" y="720" width="525" height="66" rx="8" class="item-out"/>
  <circle cx="679" cy="753" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="699" y="748" class="item-label">Neural-network generalization theorem</text>
  <text x="699" y="770" class="item-sub">norm-controlled, compression, or margin routes</text>

  <text x="40" y="846" class="footer">Checked items name at least one axiom-clean Lean theorem with a #print axioms transcript; exact hypotheses live in the signatures.</text>
  <text x="40" y="872" class="footer">Open targets are tracked in docs/open-formalization-problems.md and the generated proof-frontier manifest.</text>
</svg>
