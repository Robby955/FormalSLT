  <!-- Legend: positioned in the lower-left of the plot (far from the curves which fall steeply on the right) -->
  <rect x="148" y="288" width="262" height="142" class="legend-bg"/>
  <line x1="160" y1="306" x2="200" y2="306" class="sharp-30"/>
  <line x1="160" y1="326" x2="200" y2="326" class="azuma-30"/>
  <line x1="160" y1="346" x2="200" y2="346" class="sharp-100"/>
  <line x1="160" y1="366" x2="200" y2="366" class="azuma-100"/>
  <line x1="160" y1="386" x2="200" y2="386" class="sharp-300"/>
  <line x1="160" y1="406" x2="200" y2="406" class="azuma-300"/>
  <text x="210" y="310" class="legend-text">n = 30, sharp exp(-2 eps^2 n)</text>
  <text x="210" y="330" class="legend-text">n = 30, Azuma-loose</text>
  <text x="210" y="350" class="legend-text">n = 100, sharp</text>
  <text x="210" y="370" class="legend-text">n = 100, Azuma-loose</text>
  <text x="210" y="390" class="legend-text">n = 300, sharp</text>
  <text x="210" y="410" class="legend-text">n = 300, Azuma-loose</text>

  <text x="120" y="564" class="caption">Bounds shown: sharp McDiarmid exp(-2 eps^2 n) versus Azuma-loose exp(-eps^2 n / 2) for c_i = 1/n.</text>
  <text x="120" y="582" class="caption">The 4x exponent gap is well-known mathematics. FormalSLT's contribution is the mechanized Lean 4 / Mathlib proof</text>
  <text x="120" y="600" class="caption">and its wiring into the generalization-gap layer; the math is classical (Boucheron-Lugosi-Massart, Theorem 6.2).</text>
</svg>
