<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Sharp McDiarmid vs Azuma-loose constant: tail bound across n and epsilon</title>
  <desc id="desc">Log-scale tail-bound probability against epsilon for n in 30, 100, 300, comparing the sharp exp(-2 eps^2 n) bound to the Azuma-loose exp(-eps^2 n / 2) bound.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; }
      .bg { fill: #ffffff; }
      .title-text { fill: #0f172a; font-size: 20px; font-weight: 700; }
      .subtitle { fill: #334155; font-size: 13px; }
      .axis { stroke: #334155; stroke-width: 1.6; fill: none; }
      .grid { stroke: #e2e8f0; stroke-width: 1; fill: none; }
      .tick { fill: #1e293b; font-size: 12px; }
      .axis-label { fill: #0f172a; font-size: 14px; font-weight: 700; }
      .sharp-30 { stroke: #1e293b; stroke-width: 2.4; fill: none; }
      .azuma-30 { stroke: #1e293b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .sharp-100 { stroke: #0e7490; stroke-width: 2.4; fill: none; }
      .azuma-100 { stroke: #0e7490; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .sharp-300 { stroke: #6d28d9; stroke-width: 2.4; fill: none; }
      .azuma-300 { stroke: #6d28d9; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .legend-text { fill: #0f172a; font-size: 12.5px; }
      .legend-bg { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 6; }
      .caption { fill: #1e293b; font-size: 12px; }
    </style>
  </defs>

  <rect width="960" height="640" class="bg"/>

  <text x="480" y="34" text-anchor="middle" class="title-text">Sharp McDiarmid versus Azuma-loose tail bounds</text>
  <text x="480" y="56" text-anchor="middle" class="subtitle">Bound on P(|mean - E[mean]| &gt;= epsilon) with c_i = 1/n, plotted in log-base-10 against epsilon</text>

  <!-- Plot area: x [120, 820], y [80, 480] -->
  <line x1="120" y1="480" x2="820" y2="480" class="axis"/>
  <line x1="120" y1="80"  x2="120" y2="480" class="axis"/>

  <line x1="120" y1="80"  x2="820" y2="80"  class="grid"/>
  <line x1="120" y1="160" x2="820" y2="160" class="grid"/>
  <line x1="120" y1="240" x2="820" y2="240" class="grid"/>
  <line x1="120" y1="320" x2="820" y2="320" class="grid"/>
  <line x1="120" y1="400" x2="820" y2="400" class="grid"/>

  <text x="112" y="84"  text-anchor="end" class="tick">10^0</text>
  <text x="112" y="164" text-anchor="end" class="tick">10^-8</text>
  <text x="112" y="244" text-anchor="end" class="tick">10^-15</text>
  <text x="112" y="324" text-anchor="end" class="tick">10^-22</text>
  <text x="112" y="404" text-anchor="end" class="tick">10^-30</text>

