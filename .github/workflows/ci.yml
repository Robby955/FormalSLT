name: CI

on:
  push:
    branches: [release-candidate, main]
  pull_request:
    branches: [release-candidate, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build FormalSLT

      # Applications are rooted through their own optional umbrella; the
      # default FormalSLT umbrella must not reach them.
      - name: Verify module reachability and opt-in applications
        run: python3 scripts/check_no_orphan_lean_modules.py

      - name: Check examples and tutorials
        run: make examples

      - name: Verify public API and v0.1 compatibility
        run: make api

      - name: Install repository-tool test dependency
        run: python3 -m pip install -r requirements-dev.txt

      - name: Verify controlled-queue generated artifacts
        run: make check-controlled-queue-model

      - name: Verify controlled-queue trace preprocessing
        run: make check-controlled-queue-trace

      - name: Verify controlled-queue known-kernel receipt
        run: make check-controlled-queue-known-kernel-receipt

      - name: Run repository-tool self-tests
        run: make python-tests

      - name: Verify documentation source anchors
        run: |
          python3 scripts/check_doc_anchors.py --self-test
          git ls-files -z -- '*.md' '*.mdx' | \
            xargs -0 python3 scripts/check_doc_anchors.py

      # Metadata freshness: informational only. These regenerate-and-compare
      # checks drift on every content commit, so they must NOT gate the build.
      # Refresh anytime with the two generator scripts (no --check).
      - name: Check proof frontier manifest (non-blocking)
        continue-on-error: true
        run: python3 scripts/generate_proof_frontier_manifest.py --check

      - name: Check badge counts (non-blocking)
        continue-on-error: true
        run: python3 scripts/generate_badge_counts.py --check

      - name: Verify no sorry
        run: |
          # Match 'sorry' as a standalone tactic (not in comments or strings)
          if grep -rnE --include="*.lean" '^[[:space:]]*sorry([[:space:]]|$)' FormalSLT/ FormalSLT.lean examples/; then
            echo "ERROR: sorry found in source files"
            exit 1
          fi

      - name: Verify no admit
        run: |
          if grep -rnE --include="*.lean" '^[[:space:]]*admit([[:space:]]|$)' FormalSLT/ FormalSLT.lean examples/; then
            echo "ERROR: admit found in source files"
            exit 1
          fi

      - name: Verify no custom axioms
        run: |
          if grep -rnE --include="*.lean" '^[[:space:]]*axiom[[:space:]]+' FormalSLT/ FormalSLT.lean examples/; then
            echo "ERROR: custom axiom found in source files"
            exit 1
          fi

      # The grep above only catches literal `axiom` declarations. This step
      # prints the axioms of the flagship public theorems and fails on any
      # axiom outside {propext, Classical.choice, Quot.sound}, which catches
      # kernel-trusting tactics (e.g. native_decide leaking Lean.ofReduceBool).
      - name: Verify flagship axiom cleanliness
        run: bash scripts/check_axioms.sh

      # A `#check` cannot fail on a vacuous theorem, so it certifies typing and
      # axiom-cleanliness, not satisfiability. This gate fails if any headline
      # witness file lacks an executable declaration linked to the audited
      # project surface. The parser ignores comments and rejects check-only or
      # unrelated-trivial declarations in its self-tests.
      - name: Verify witness quality (ban fake receipt files)
        run: bash scripts/check_witness_quality.sh

      # Statement-level non-vacuity: lints the .lean files CHANGED by this PR
      # for near-vacuity shapes (∀var ∃const quantifier inversion, `: True`
      # conclusion, `: False` hypothesis) that build/axiom/witness gates miss,
      # and fails on any unsigned flag. A genuine statement that trips the lint
      # carries an inline `-- fidelity:` sign-off. Self-tests its detector on a
      # vacuous/genuine fixture pair. The base ref is passed so the diff is
      # scoped to the PR; on push it falls back to HEAD~1, else all files.
      - name: Verify statement fidelity (non-vacuity, changed files)
        env:
          FIDELITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check_statement_fidelity.sh

      - name: Verify no custom constants
        run: |
          if grep -rnE --include="*.lean" '^[[:space:]]*constant[[:space:]]+[^:]+:' FormalSLT/ FormalSLT.lean examples/; then
            echo "ERROR: custom constant found in source files"
            exit 1
          fi

      - name: Count lines
        run: |
          echo "Total Lean lines:"
          find FormalSLT/ -name '*.lean' -exec cat {} + | wc -l
          echo "Module count:"
          find FormalSLT/ -name '*.lean' | wc -l

  downstream:
    name: downstream (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get downstream Mathlib cache
        working-directory: tests/downstream
        run: lake exe cache get

      - name: Build downstream consumer
        working-directory: tests/downstream
        run: lake build Downstream
