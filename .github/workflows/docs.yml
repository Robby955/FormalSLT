name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: docs-lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: docs-lake-${{ runner.os }}-

      # Run with -Kenv=dev so the very first Lake invocation elaborates the
      # lakefile config with the doc-gen4 dev dependency active. This resolves
      # and clones doc-gen4 (registering its `docs` library facet) alongside the
      # Mathlib olean download. Without it, a plain `lake exe cache get` caches a
      # config that omits doc-gen4, and the later docs build fails with
      # "unknown lean_lib facet `docs`".
      - name: Get Mathlib cache and resolve doc-gen4
        run: lake -Kenv=dev exe cache get

      - name: Build docs
        run: lake -Kenv=dev build FormalSLT:docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .lake/build/doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
