name: Docs

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - LICENSE
      - CITATION.cff
      - media/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  # Only the newest main SHA or manual run should consume doc-gen4/Pages.
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check static documentation sources
        run: |
          python3 scripts/generate_theorem_index.py --self-test
          python3 scripts/generate_theorem_index.py --check
          python3 scripts/stage_docs_site.py --check-source
          python3 scripts/stage_docs_site.py --self-test

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: docs-lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: docs-lake-${{ runner.os }}-

      # Re-elaborate the Lake configuration with the doc-gen4 dev dependency
      # active. `-R` prevents a restored non-dev configuration from omitting
      # doc-gen4 and causing "unknown lean_lib facet `docs`" in the next step.
      - name: Get Mathlib cache and resolve doc-gen4
        run: lake -R -Kenv=dev exe cache get

      - name: Build docs
        run: lake -Kenv=dev build FormalSLT:docs

      - name: Stage research landing and pinned theorem index
        run: >-
          python3 scripts/stage_docs_site.py
          --doc-root .lake/build/doc
          --source-ref "$(git rev-parse HEAD)"

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .lake/build/doc
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
