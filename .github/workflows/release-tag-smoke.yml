name: Release tag install smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing FormalSLT release tag to install and verify
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

jobs:
  tag-install:
    name: tag install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install and build the tagged release downstream
        env:
          FORMALSLT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/check_tag_install.sh "$FORMALSLT_RELEASE_TAG"
